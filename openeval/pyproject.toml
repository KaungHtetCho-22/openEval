[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "openeval-ai"
version = "0.1.0"
description = "Model-agnostic LLM evaluation that feels like pytest."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "OpenEval Contributors" }]
requires-python = ">=3.11"
keywords = ["llm", "evaluation", "testing", "pytest"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.24",
    "typer>=0.12",
    "rich>=13.7",
]

[project.urls]
Homepage = "https://github.com/KaungHtetCho-22/openEval"
Repository = "https://github.com/KaungHtetCho-22/openEval"
Documentation = "https://kaunghtetcho-22.github.io/openEval/"
Issues = "https://github.com/KaungHtetCho-22/openEval/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "mkdocs>=1.6.0",
  "mkdocs-material>=9.5.0",
  "mkdocstrings[python]>=0.25.0",
  "ruff>=0.6.0",
  "mypy>=1.10.0",
  "pre-commit>=3.7.0",
]
semantic = ["sentence-transformers>=2.2"]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.20"]

[tool.hatch.build.targets.wheel]
packages = ["openeval", "pytest_openeval"]

[project.scripts]
openeval = "openeval.cli:app"

[project.entry-points."pytest11"]
openeval = "pytest_openeval.plugin"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"openeval/report.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
ignore_missing_imports = true
