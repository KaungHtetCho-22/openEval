site_name: OpenEval
site_description: "LLM evals that don't get in your way."
repo_name: openeval
repo_url: https://github.com/yourname/openeval
edit_uri: edit/main/openeval/docs/

theme:
  name: material
  palette:
    primary: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quickstart.md
      - Your First Eval: getting-started/first-eval.md
  - Guides:
      - Writing Scorers: guides/scorers.md
      - Using Adapters: guides/adapters.md
      - Loading Datasets: guides/datasets.md
      - Eval Suites: guides/suites.md
      - CLI Reference: guides/cli.md
      - GitHub Action: guides/github-action.md
      - Async Evaluation: guides/async.md
  - Examples: examples/index.md
  - API Reference: api/index.md

